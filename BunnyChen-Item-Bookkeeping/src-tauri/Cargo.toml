[package]
name = "bunnychen-item-bookkeeping"
version = "1.1.0"
description = "日耗仓 · DailyCost Vault — 个人资产数字化管理工具"
authors = ["BunnyChen"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bunnychen_item_bookkeeping_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
csv = "1.3"
calamine = "0.24"
chrono = "0.4"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Android 上 reqwest/rustls 需要显式安装 crypto provider（否则启动即崩溃）
# ring 是纯 Rust 实现，跨平台兼容性最好；aws_lc_rs 需要 C 编译器
# 参考：https://docs.rs/rustls/latest/rustls/#cryptography-providers
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
