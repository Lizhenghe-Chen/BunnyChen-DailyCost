site_name: 日耗仓 · DailyCost Vault
site_description: >-
  日耗仓（DailyCost Vault）—— 长期主义个人资产数字化管理工具。跨平台消费记录自动转化、日均持有成本计算、资产卡片管理。
site_url: https://bunnychen.top/BunnyChen-DailyCost/
site_author: BunnyChen

# -------------------------------------------------------------------------- #
# 仓库信息
# -------------------------------------------------------------------------- #
repo_name: BunnyChen-DailyCost
repo_url: https://github.com/Lizhenghe-Chen/BunnyChen-DailyCost

# -------------------------------------------------------------------------- #
# 插件配置
# -------------------------------------------------------------------------- #
plugins:
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
        - locale: en
          name: English
          build: true
          site_name: DailyCost Vault
          site_description: >-
            DailyCost Vault — A long-term personal asset digital management tool.
            Cross-platform purchase tracking, daily average cost calculation, and asset card management.
          nav_translations:
            主页: Home
            使用指南: User Guide
            🚀 安装与启动: 🚀 Installation
            📥 批量导入订单: 📥 Import CSV Orders
            📋 浏览与管理资产: 📋 Manage Assets
            📊 数据分析: 📊 Analytics
            ⚙️ 个性化设置: ⚙️ Settings
            💾 数据管理与备份: 💾 Data & Backup
            常见问题: FAQ
            隐私说明: Privacy Policy

# -------------------------------------------------------------------------- #
# 主题配置
# -------------------------------------------------------------------------- #
theme:
  name: material
  custom_dir: overrides
  icon:
    repo: octicons/mark-github-24
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    # --- 内容增强 ---
    - content.code.copy
    - content.tooltips
    # --- 导航增强 ---
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    # --- 搜索增强 ---
    - search.highlight
    - search.share
    - search.suggest
    # --- 目录增强 ---
    - toc.follow
  palette:
    # 跟随系统
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/lightbulb-auto
        name: 切换到浅色模式
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/lightbulb
        name: 切换到深色模式
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/lightbulb-outline
        name: 跟随系统

# -------------------------------------------------------------------------- #
# Markdown 扩展
# -------------------------------------------------------------------------- #
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences

# -------------------------------------------------------------------------- #
# 导航
# -------------------------------------------------------------------------- #
nav:
  - 主页: index.md
  - 使用指南:
    - 🚀 安装与启动: getting-started.md
    - 📥 批量导入订单: import-csv.md
    - 📋 浏览与管理资产: manage-items.md
    - 📊 数据分析: analytics.md
    - ⚙️ 个性化设置: settings.md
    - 💾 数据管理与备份: data-management.md
  - 常见问题: FAQ.md
  - 隐私说明: PRIVACY.md

# -------------------------------------------------------------------------- #
# 额外配置
# -------------------------------------------------------------------------- #
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/theme-carousel.js

copyright: "&copy; 2025–2026 BunnyChen"
